[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-rag-pipeline"
version = "0.1.0"
description = "Multi-provider RAG pipeline with hybrid retrieval, an anti-hallucination grounding gate, indirect prompt-injection quarantine and CI evals that need no API key."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaffeth Alfaro" }]
keywords = ["rag", "llm", "retrieval", "bm25", "grounding", "hallucination", "fastapi", "evals"]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "httpx2>=2.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "ruff==0.17.1",
]
serve = ["uvicorn>=0.29"]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
embeddings = ["sentence-transformers>=3.0"]
watsonx = ["ibm-watsonx-ai>=1.1"]
groq = ["groq>=0.9"]
huggingface = ["huggingface_hub>=0.24"]
ollama = ["ollama>=0.4"]

[project.scripts]
grounded-rag = "grounded_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
