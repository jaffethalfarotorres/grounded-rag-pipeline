name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit and property tests (no credentials needed)
        run: pytest --cov=grounded_rag --cov-report=term-missing
      - name: Eval gates (retrieval, grounding, injection, qa)
        run: python -m grounded_rag.eval

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t grounded-rag .
      - name: Start the API
        run: docker run -d --name rag -p 8000:8000 grounded-rag
      - name: Ask the running container a question
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8000/query \
            -H 'content-type: application/json' \
            -d '{"question": "How long are backups kept?"}' | tee answer.json
          python3 -c "import json; a = json.load(open('answer.json')); assert a['status'] == 'answered' and '35 days' in a['answer'], a"
          curl -fsS http://127.0.0.1:8000/metrics | grep 'rag_queries_total{status="answered"} 1'
      - name: Container logs
        if: always()
        run: docker logs rag
